name: Data Integrity Tests

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'tests/data-integrity/**'

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Data Integrity Checks
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p test-results
          node tests/data-integrity/run-consistency-checks.js > test-results/consistency-check-report.json 2>&1 || true
          echo "Data integrity checks completed"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-results
          path: test-results/

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Data Integrity Test Results - ${{ job.status }}"
            }
