name: Security Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3232A
          echo "deb [signed-by=/usr/share/keyrings/grafana-keyring.gpg] https://apt.grafana.com stable main" | sudo tee /etc/apt/sources.list.d/grafana.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run Security Tests
        env:
          BASE_URL: https://staging.redeemrocket.in
          API_KEY: ${{ secrets.API_TEST_KEY }}
          BUSINESS_ID: ${{ secrets.TEST_BUSINESS_ID }}
        run: |
          mkdir -p test-results
          k6 run tests/security/security-tests.k6.js -o json=test-results/security-tests.json || true
          echo "Security tests completed"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: test-results/

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Security Test Results - ${{ job.status }}"
            }
