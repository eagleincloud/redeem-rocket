<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redeem Rocket</title>
  <link rel="icon" href="/logo.png" />
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      text-align: center;
    }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      opacity: 0.9;
    }
    .loading-subtext {
      font-size: 14px;
      opacity: 0.7;
    }
    noscript {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
    }
    .noscript-content {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }
    .noscript-content h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .noscript-content p {
      color: #666;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .noscript-content a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <div class="loading-text">Loading Application</div>
        <div class="loading-subtext">Please wait...</div>
      </div>
    </div>
  </div>

  <noscript>
    <div class="noscript-content">
      <h1>JavaScript Required</h1>
      <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings and reload the page.</p>
      <p>If you continue to experience issues, please <a href="mailto:support@redeemrocket.in">contact support</a>.</p>
    </div>
  </noscript>

  <script type="module">
    const pathname = window.location.pathname || '/';
    const normalized = pathname === '/' ? '/' : pathname.replace(/\/$/, '');
    const isAdmin = normalized === '/admin' || normalized.startsWith('/admin/');
    const appType = isAdmin ? 'admin' : 'business';
    const bundlePath = isAdmin ? '/admin.html' : '/business.html';

    async function initializeRouter() {
      try {
        const loadingText = document.querySelector('.loading-text');
        if (loadingText) {
          loadingText.textContent = `Loading ${appType === 'admin' ? 'Admin' : 'Business'} Application`;
        }

        const response = await fetch(bundlePath, {
          headers: { 'Accept': 'text/html' },
        });

        if (!response.ok) {
          throw new Error(`Failed to load ${appType} app: ${response.status} ${response.statusText}`);
        }

        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const moduleScript = doc.querySelector('script[type="module"]');
        if (!moduleScript || !moduleScript.src) {
          throw new Error(`No module script found in ${appType} app HTML`);
        }

        const scriptSrc = moduleScript.src;
        const rootElement = document.getElementById('root');
        if (rootElement) {
          rootElement.innerHTML = '';
        }

        const script = document.createElement('script');
        script.type = 'module';
        script.src = scriptSrc;
        script.onerror = () => {
          showError(`Failed to load module: ${scriptSrc}`);
        };

        document.body.appendChild(script);
        console.log(`Successfully initialized ${appType} app from ${bundlePath}`);
      } catch (error) {
        console.error(`Router initialization error:`, error);
        showError(error instanceof Error ? error.message : String(error));
      }
    }

    function showError(message) {
      const rootElement = document.getElementById('root');
      if (!rootElement) return;

      const escapedMessage = message
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      rootElement.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px;">
          <div style="text-align: center; max-width: 600px; background: rgba(0, 0, 0, 0.2); padding: 40px; border-radius: 8px; backdrop-filter: blur(10px);">
            <h1 style="margin: 0 0 20px 0; font-size: 24px;">Failed to Load Application</h1>
            <p style="margin: 0 0 20px 0; font-size: 16px; opacity: 0.9;">We encountered an error loading the ${appType} application.</p>
            <p style="margin: 0 0 20px 0; font-size: 14px; background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 4px; font-family: 'Courier New', monospace; text-align: left; overflow-x: auto; white-space: pre-wrap; word-break: break-word;">${escapedMessage}</p>
            <button onclick="window.location.reload()" style="padding: 12px 24px; font-size: 16px; background: white; color: #667eea; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">Retry Loading</button>
          </div>
        </div>
      `;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeRouter);
    } else {
      initializeRouter();
    }
  </script>
</body>
</html>
